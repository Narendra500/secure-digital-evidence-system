services:
  nginx:
    image: nginx:alpine
    container_name: sdes_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service-go
      - audit-service-go
      - case-service
      - evidence-service-go
    networks:
      - sdes_network
  frontend:
    build: ./frontend/
    container_name: sdes_frontend
    restart: unless-stopped
    ports:
      - 5173:5173
    depends_on:
      - nginx
    volumes:
      - ./frontend/:/app
      - /app/node_modules
    networks:
      - sdes_network
  auth-service-go:
    build: ./services/auth-service/
    container_name: sdes_auth
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./services/auth-service/:/app
    environment:
      DB_CONN_STR: "host=db port=5432 user=evidence_user password=evidence_pass dbname=evidence_db sslmode=disable search_path=auth_schema"
    networks:
      - sdes_network
  nats:
    image: nats:2.10-alpine
    container_name: sdes_nats
    restart: unless-stopped
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - sdes_network
  audit-service-go:
    build:
      context: ./services/audit-service/
      network: host
    container_name: sdes_audit
    restart: unless-stopped
    depends_on:
      - db
      - nats
    volumes:
      - ./services/audit-service/:/app
    environment:
      DB_CONN_STR: "host=db port=5432 user=evidence_user password=evidence_pass dbname=evidence_db sslmode=disable search_path=integrity_schema"
      NATS_URL: "nats://nats:4222"
    networks:
      - sdes_network
  audit-worker-go:
    build:
      context: ./services/audit-worker/
      network: host
    container_name: sdes_audit_worker
    restart: unless-stopped
    depends_on:
      - db
      - nats
    volumes:
      - ./services/audit-worker/:/app
    environment:
      DB_CONN_STR: "host=db port=5432 user=evidence_user password=evidence_pass dbname=evidence_db sslmode=disable search_path=integrity_schema"
      NATS_URL: "nats://nats:4222"
      REKOR_URL: "https://rekor.sigstore.dev"
      BATCH_SIZE: "100"
      BATCH_INTERVAL_MINUTES: "20"
    networks:
      - sdes_network
  case-service:
    build: ./services/case-service/
    container_name: sdes_case
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./services/case-service/:/app
      - /app/node_modules
    networks:
      - sdes_network
  evidence-service-go:
    build: ./services/evidence-service/
    container_name: sdes_evidence
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./services/evidence-service/:/app
    environment:
      DB_CONN_STR: "host=db port=5432 user=evidence_user password=evidence_pass dbname=evidence_db sslmode=disable search_path=evidence_schema"
    networks:
      - sdes_network
  db:
    image: postgres:18.2-bookworm
    container_name: sdes_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evidence_user
      POSTGRES_PASSWORD: evidence_pass
      POSTGRES_DB: evidence_db
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - 5432:5432
    networks:
      - sdes_network

volumes:
  pgdata:
    external: true
networks:
  sdes_network:
    driver: bridge
