services:
  auth-service-go:
    build: ./auth-service/
    restart: unless-stopped
    ports:
      - 3001:3001
    depends_on:
      - db
    volumes:
      - ./auth-service/:/app
    environment:
      DB_CONN_STR: "host=db port=5432 user=evidence_user password=evidence_pass dbname=evidence_db sslmode=disable search_path=auth_schema"
    networks:
      - sdes_network
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - sdes_network
  audit-service-go:
    build: ./audit-service/
    restart: unless-stopped
    ports:
      - 3002:3002
    depends_on:
      - db
      - nats
    volumes:
      - ./audit-service/:/app
    environment:
      DB_CONN_STR: "host=db port=5432 user=evidence_user password=evidence_pass dbname=evidence_db sslmode=disable search_path=integrity_schema"
      NATS_URL: "nats://nats:4222"
    networks:
      - sdes_network
  audit-worker-go:
    build: ./audit-worker/
    restart: unless-stopped
    depends_on:
      - db
      - nats
    volumes:
      - ./audit-worker/:/app
    environment:
      DB_CONN_STR: "host=db port=5432 user=evidence_user password=evidence_pass dbname=evidence_db sslmode=disable search_path=integrity_schema"
      NATS_URL: "nats://nats:4222"
      REKOR_URL: "https://rekor.sigstore.dev"
      BATCH_SIZE: "100"
      BATCH_INTERVAL_MINUTES: "20"
    networks:
      - sdes_network
  case-service:
    build: ./case-service/
    restart: unless-stopped
    ports:
      - "3003:3003"
    depends_on:
      - db
    volumes:
      - ./case-service/:/app
      - /app/node_modules
    networks:
      - sdes_network
  evidence-service-go:
    build: ./evidence-service/
    restart: unless-stopped
    ports:
      - 3004:3004
    depends_on:
      - db
    volumes:
      - ./evidence-service/:/app
    environment:
      DB_CONN_STR: "host=db port=5432 user=evidence_user password=evidence_pass dbname=evidence_db sslmode=disable search_path=evidence_schema"
    networks:
      - sdes_network
  db:
    image: postgres:18.2-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: evidence_user
      POSTGRES_PASSWORD: evidence_pass
      POSTGRES_DB: evidence_db
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - 5432:5432
    networks:
      - sdes_network

volumes:
  pgdata:
    external: true
networks:
  sdes_network:
    driver: bridge
