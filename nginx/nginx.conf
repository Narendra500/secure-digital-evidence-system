upstream auth_service {
    server sdes_auth:3001;
}

upstream audit_service {
    server sdes_audit:3002;
}

upstream case_service {
    server sdes_case:3003;
}

upstream evidence_service {
    server sdes_evidence:3004;
}

server {
    listen 80;
    server_name _;

    # Increase max body size for evidence file uploads
    client_max_body_size 2048M;

    # ---------- Auth Service ----------
    location /api/v1/auth/ {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Audit Service ----------
    # Routes prefixed with /api/v1/audit/
    location /api/v1/audit/ {
        proxy_pass http://audit_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Case Service ----------
    location /api/v1/cases/ {
        proxy_pass http://case_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Exact match for /api/v1/cases (no trailing slash — for GET list and POST create)
    location = /api/v1/cases {
        proxy_pass http://case_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Case Service internal routes
    location /api/v1/internal/cases/ {
        proxy_pass http://case_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Evidence Service ----------
    location /api/v1/evidence/ {
        proxy_pass http://evidence_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Exact match for /api/v1/evidence (for GET list and POST upload)
    location = /api/v1/evidence {
        proxy_pass http://evidence_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy /evidence routes (used by frontend for uploads/downloads)
    location /evidence {
        proxy_pass http://evidence_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
